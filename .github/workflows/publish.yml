name: Publish changed crates

on:
  push:
    branches: [master]
    paths:
      - crates/**
      - Cargo.toml
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package without uploading
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-ps-observability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Changed packages, dependency order
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Publish versions absent from crates.io
        shell: zsh {0}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          publish_if_new() {
            local package="$1"
            local version
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg package "$package" \
                '.packages[] | select(.name == $package) | .version')"
            local published
            published="$(curl -sS -H 'User-Agent: pathscale-ci' \
              "https://crates.io/api/v1/crates/$package/versions" \
              | jq -r --arg version "$version" \
                '.versions[]? | select(.num == $version) | .num' 2>/dev/null || true)"

            if [[ -n "$published" ]]; then
              print "$package $version is already published"
              return
            fi

            cargo package -p "$package"
            if [[ '${{ inputs.dry_run }}' == 'true' ]]; then
              print "dry run: $package $version packaged"
            else
              cargo publish -p "$package"
              for attempt in {1..60}; do
                if cargo info "$package@$version" >/dev/null 2>&1; then
                  print "$package $version is available from the registry"
                  return
                fi
                sleep 2
              done
              print -u2 "$package $version did not reach the registry within 120 seconds"
              return 1
            fi
          }

          publish_if_new blitz-control-protocol
          publish_if_new ps-blitz-debug-control
          publish_if_new ps-qa
          # The host embeds tauri-runtime-blitz, which in turn consumes the
          # protocol above. Keep it last so a new protocol and driver can ship
          # before the corresponding runtime release reaches crates.io.
          publish_if_new qa-inspect-host
