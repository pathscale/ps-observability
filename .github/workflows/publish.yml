name: Publish

# A reviewed version bump is the release trigger. Source-only pushes at an
# already-published version exit cleanly instead of attempting to overwrite it.
on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - src/**
      - .github/workflows/publish.yml
  workflow_dispatch:

concurrency:
  group: publish-qa-inspect-host
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: crates.io
    # The host links the native renderer. Its Linux runtime cannot currently
    # implement Tauri's GTK-only traits, so package it on the supported host.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check registry state
        id: registry
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          published="$(curl -sS -H 'User-Agent: pathscale-ci' \
            'https://crates.io/api/v1/crates/qa-inspect-host/versions' \
            | jq -r --arg version "$version" \
              '.versions[]? | select(.num == $version) | .num')"
          if [ -n "$published" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "qa-inspect-host $version is already published"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo "qa-inspect-host $version is new"
          fi

      - name: Verify package
        if: steps.registry.outputs.publish == 'true'
        run: cargo package

      - name: Publish package
        if: steps.registry.outputs.publish == 'true'
        run: cargo publish
