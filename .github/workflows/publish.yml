name: Publish changed crates

on:
  push:
    branches: [master]
    paths:
      - crates/**
      - Cargo.toml
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package without uploading
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-ps-observability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Changed packages, dependency order
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish versions absent from crates.io
        shell: zsh {0}
        run: |
          set -euo pipefail

          publish_if_new() {
            local package="$1"
            local manifest="crates/$2/Cargo.toml"
            local version
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$manifest" | head -1)"
            local published
            published="$(curl -fsS -H 'User-Agent: pathscale-ci' \
              "https://crates.io/api/v1/crates/$package/versions" \
              | jq -r --arg version "$version" \
                '.versions[]? | select(.num == $version) | .num')"

            if [[ -n "$published" ]]; then
              print "$package $version is already published"
              return
            fi

            cargo package -p "$package"
            if [[ '${{ inputs.dry_run }}' == 'true' ]]; then
              print "dry run: $package $version packaged"
            else
              cargo publish -p "$package"
            fi
          }

          publish_if_new blitz-control-protocol blitz-control-protocol
          publish_if_new ps-blitz-debug-control ps-blitz-debug-control
          publish_if_new qa-inspect-host qa-inspect-host
          publish_if_new ps-qa ps-qa
