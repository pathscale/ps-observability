name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Protocol, transports, and driver (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p blitz-control-protocol -p ps-blitz-debug-control -p ps-qa --all-targets -- -D warnings
      - name: Test
        run: cargo test -p blitz-control-protocol -p ps-blitz-debug-control -p ps-qa
      - name: Keep the driver renderer-free
        run: |
          cargo tree -p ps-qa > /tmp/ps-qa-tree.txt
          if grep -Eq '(^| )((ps-)?blitz-(dom|html|paint|shell)|tauri|winit|wgpu) v' /tmp/ps-qa-tree.txt; then
            echo 'ps-qa pulled a renderer or window runtime into its dependency tree' >&2
            exit 1
          fi

  host:
    name: Renderer host and live socket (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy host
        run: cargo clippy -p qa-inspect-host --all-targets -- -D warnings
      - name: Test real host transport
        run: cargo test -p qa-inspect-host --release

  package:
    name: Package boundaries
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: zsh {0}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package independently versioned crates
        run: |
          set -euo pipefail

          cargo package -p blitz-control-protocol
          cargo package -p ps-blitz-debug-control

          protocol_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' \
            crates/blitz-control-protocol/Cargo.toml | head -1)"
          published="$(curl -fsS -H 'User-Agent: pathscale-ci' \
            'https://crates.io/api/v1/crates/blitz-control-protocol/versions' \
            | jq -r --arg version "$protocol_version" \
              '.versions[]? | select(.num == $version) | .num')"
          if [[ -z "$published" ]]; then
            print "dependent package verification waits for protocol $protocol_version publication"
            exit 0
          fi

          cargo package -p qa-inspect-host
          cargo package -p ps-qa
