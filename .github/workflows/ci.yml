name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum Rust 1.88 (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p blitz-control-protocol -p ps-blitz-debug-control -p ps-qa

  core:
    name: Protocol, transports, and driver (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p blitz-control-protocol -p ps-blitz-debug-control -p ps-qa --all-targets -- -D warnings
      - name: Test
        run: cargo test -p blitz-control-protocol -p ps-blitz-debug-control -p ps-qa
      - name: Keep the driver renderer-free
        run: |
          cargo tree -p ps-qa > /tmp/ps-qa-tree.txt
          if grep -Eq '(^| )((ps-)?blitz-(dom|html|paint|shell)|tauri|winit|wgpu) v' /tmp/ps-qa-tree.txt; then
            echo 'ps-qa pulled a renderer or window runtime into its dependency tree' >&2
            exit 1
          fi

  host:
    name: Renderer host and live socket (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy host
        run: cargo clippy -p qa-inspect-host --all-targets -- -D warnings
      - name: Test real host transport
        run: cargo test -p qa-inspect-host --release
      - name: Test documented renderer-backed QA fixture
        shell: zsh {0}
        run: |
          set -euo pipefail
          cargo build -p qa-inspect-host -p ps-qa --release
          target/release/ps-qa \
            --app crates/qa-inspect-host/tests/fixture/ps-qa.ron \
            qa-hosted fixture-text-entry \
            --host target/release/qa-inspect-host \
            --page crates/qa-inspect-host/tests/fixture/page.html \
            --checks crates/qa-inspect-host/tests/fixture/checks

  package:
    name: Package boundaries
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: zsh {0}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package independently versioned crates
        run: |
          set -euo pipefail

          cargo package -p blitz-control-protocol
          cargo package -p ps-blitz-debug-control
          # The new protocol cannot exist in the registry before this PR is
          # merged. Verify the driver tarball against this exact
          # protocol source without installing a persistent workspace patch;
          # publish.yml repeats ordinary registry-backed `cargo package` after
          # publishing the protocol and before uploading the driver.
          cargo package -p qa-inspect-host
          cargo --config 'patch.crates-io.blitz-control-protocol.path="crates/blitz-control-protocol"' \
            package -p ps-qa
