name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host (macOS)
    # A renderer, so this is not a Linux-only check: the host links blitz and
    # builds the same way the QA sweep runs it.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The sibling checkout the `[patch.crates-io]` in Cargo.toml points at.
      #
      # That patch is temporary: it exists until tauri-runtime-blitz publishes
      # the exports this host needs (`AgentControlServer::start`,
      # `inspect_document`, `click_agent_node`, `press_agent_key`). Until then a
      # path patch is the only way to build, and a path patch needs the path to
      # exist, so CI checks the sibling out beside this repository exactly as a
      # developer has it. Delete this step and the patch together.
      - uses: actions/checkout@v4
        with:
          repository: pathscale/tauri-runtime-blitz
          ref: expose-headless-inspection
          path: ../tauri-runtime-blitz
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
