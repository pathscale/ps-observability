name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum Rust 1.88 (Linux)
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check -p blitz-control-protocol -p ps-blitz-debug-control -p ps-qa

  core:
    name: Protocol, transports, and driver (Linux)
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p blitz-control-protocol -p ps-blitz-debug-control -p ps-qa --all-targets -- -D warnings
      - name: Test
        run: cargo test -p blitz-control-protocol -p ps-blitz-debug-control -p ps-qa
      - name: Keep the driver renderer-free
        run: |
          cargo tree -p ps-qa > /tmp/ps-qa-tree.txt
          if grep -Eq '(^| )((ps-)?blitz-(dom|html|paint|shell)|tauri|winit|wgpu) v' /tmp/ps-qa-tree.txt; then
            echo 'ps-qa pulled a renderer or window runtime into its dependency tree' >&2
            exit 1
          fi

  host:
    name: Renderer host and live socket
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Nothing is installed for this job, and that is the assertion. The host
      # serves a socket over a document; it opens no window and reads no font
      # catalogue, so it should need no system library at all.
      #
      # `fontconfig-sys`, not `fontconfig`: the pattern is for crates that link
      # a system library, and `fontconfig-parser` is not one. It is pure Rust
      # that reads fontconfig's XML, it arrives through `fontdb` behind usvg,
      # and matching it failed this job for a dependency that needs nothing
      # installed.
      #
      # `--edges normal,dev`, not `normal`. A dev-dependency is precisely how
      # this escaped upstream: ps-blitz's `blitz-script` and `blitz-wasm` each
      # pulled `blitz-dom` with `system-fonts` so their tests could measure
      # text, which put fontconfig in front of `cargo test` on Linux while the
      # shipped crates were clean. This job runs `cargo test` below, so the
      # graph it needs to assert about is the one including dev edges.
      #
      # The target is pinned rather than left implicit. `yeslogic-fontconfig-sys`
      # is reached only on Linux, so a check that inherits the host's target
      # says nothing the day someone runs it anywhere else.
      #
      # ps-blitz#87 has an equivalent gate, as `cargo deny`. It is not a
      # substitute for this one: that guards ps-blitz's own crates, this guards
      # the assembled host, which also pulls tauri-runtime-blitz. Worth
      # converting to `cargo deny` here too, for the same reason the pattern
      # below had to be corrected once already.
      - name: No system libraries in the graph
        run: |
          found=$(cargo tree -p qa-inspect-host --edges normal,dev \
            --target x86_64-unknown-linux-gnu \
            | grep -ciE 'fontconfig-sys|tauri v|gtk|glib|webkit|soup' || true)
          if [ "$found" != "0" ]; then
            echo "the host pulled in $found system-library crates" >&2
            cargo tree -p qa-inspect-host --edges normal,dev \
              --target x86_64-unknown-linux-gnu \
              | grep -iE 'fontconfig-sys|tauri v|gtk|glib|webkit|soup' >&2 || true
            exit 1
          fi
      - name: Clippy host
        run: cargo clippy -p qa-inspect-host --all-targets -- -D warnings
      - name: Test real host transport
        run: cargo test -p qa-inspect-host --release
      - name: Test documented renderer-backed QA fixture
        shell: bash {0}
        run: |
          set -euo pipefail
          cargo build -p qa-inspect-host -p ps-qa --release
          target/release/ps-qa \
            --app crates/qa-inspect-host/tests/fixture/ps-qa.ron \
            qa-hosted fixture-text-entry \
            --host target/release/qa-inspect-host \
            --page crates/qa-inspect-host/tests/fixture/page.html \
            --checks crates/qa-inspect-host/tests/fixture/checks

  package:
    name: Package boundaries
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    defaults:
      run:
        shell: bash {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Package independently versioned crates
        run: |
          set -euo pipefail

          cargo package -p blitz-control-protocol
          cargo package -p ps-blitz-debug-control
          # The new protocol cannot exist in the registry before this PR is
          # merged. Verify the driver tarball against this exact
          # protocol source without installing a persistent workspace patch;
          # publish.yml repeats ordinary registry-backed `cargo package` after
          # publishing the protocol and before uploading the driver.
          cargo package -p qa-inspect-host
          cargo --config 'patch.crates-io.blitz-control-protocol.path="crates/blitz-control-protocol"' \
            package -p ps-qa
