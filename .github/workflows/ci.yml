name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host (macOS)
    # A renderer, so this is not a Linux-only check: the host links blitz and
    # builds the same way the QA sweep runs it.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      #
      # The sibling the `[patch.crates-io]` in Cargo.toml points at, until
      # tauri-runtime-blitz publishes `hover_agent_node` (TRB#36). A path patch
      # needs the path to exist, and a runner has no sibling checkout, so every
      # job failed to load the dependency before compiling anything.
      #
      # Checked out inside the workspace and moved: `actions/checkout` refuses
      # a path outside the repository directory. Delete this step and the patch
      # together once 0.1.10 is on crates.io.
      - uses: actions/checkout@v4
        with:
          repository: pathscale/tauri-runtime-blitz
          ref: master
          path: .trb-checkout
      - name: Put the sibling where the patch expects it
        run: mv .trb-checkout ../tauri-runtime-blitz
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      # Launches a real host against a real page and connects to the socket it
      # announces. `ps-qa` cannot cover this: it is forbidden from linking
      # blitz, so nothing on its side can start a host. Without this the whole
      # serving path had no CI at all.
      - name: Test
        run: cargo test --release
