[package]
name = "qa-inspect-host"
description = "Host a Blitz document and serve it over the inspection socket"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pathscale/qa-inspect-host"
keywords = ["qa", "testing", "blitz", "inspection", "ui"]
categories = ["development-tools::testing"]

# This is the half of a QA sweep that must link a renderer. `ps-qa` drives it
# over a socket and is forbidden from depending on blitz, tauri, winit or wgpu,
# precisely so that driving a control does not build a browser engine. Keeping
# the host in its own crate is what lets both stay true.
[dependencies]
blitz-dom = { package = "ps-blitz-dom", version = "^0.3.0-beta.11", features = ["system-fonts"] }
blitz-script = { package = "ps-blitz-script", version = "^0.3.0-beta.11", features = ["system-fonts"] }
blitz-traits = { package = "ps-blitz-traits", version = "^0.3.0-beta.11" }
brotli = { version = "^8.0.4", default-features = false, features = ["std"] }
tauri-runtime-blitz = { version = "^0.1.9", features = ["agent-control"] }
# Only the channel: `ControlBridge` hands its answer back on a
# `tokio::sync::oneshot`, so the type has to match. No runtime, no reactor.
tokio = { version = "^1", default-features = false, features = ["sync"] }
url = "^2.5.8"

[features]
# Off by default. The bridge has an arm for diagnostics requests behind this,
# matching the variant tauri-runtime-blitz only defines when its own
# `diagnostics` feature is on; declaring it here is what stops the `cfg` from
# being an unexpected condition. A host that wants to answer diagnostics turns
# both on together.
diagnostics = ["tauri-runtime-blitz/diagnostics"]

# Until tauri-runtime-blitz publishes `hover_agent_node`, which this host needs
# to reach a control revealed on hover. A git dependency rather than a path
# patch: a path needs a sibling checkout that exists on nobody's CI runner, and
# working around that meant checking the sibling out inside the workspace and
# moving it, which is two hacks stacked on a third.
#
# Drop back to a plain version once 0.1.10 is on crates.io.
[patch.crates-io]
tauri-runtime-blitz = { git = "https://github.com/pathscale/tauri-runtime-blitz", branch = "master" }
blitz-control-protocol = { git = "https://github.com/pathscale/tauri-runtime-blitz", branch = "master" }
